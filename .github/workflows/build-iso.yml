name: build-iso

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Instalar deps do host
        run: |
          sudo apt update
          sudo apt install -y debootstrap squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin mtools dosfstools

      - name: Bootstrap Noble (debootstrap)
        run: |
          sudo debootstrap --arch=amd64 noble chroot http://archive.ubuntu.com/ubuntu
          sudo mount -t proc /proc chroot/proc
          sudo mount --rbind /sys chroot/sys
          sudo mount --rbind /dev chroot/dev
          sudo mkdir -p chroot/usr/share/keyrings
          sudo cp /usr/share/keyrings/ubuntu-archive-keyring.gpg chroot/usr/share/keyrings/
          sudo tee chroot/etc/apt/sources.list.d/ubuntu.sources > /dev/null <<'EOF'
          Types: deb
          URIs: http://archive.ubuntu.com/ubuntu
          Suites: noble noble-updates noble-backports
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: http://security.ubuntu.com/ubuntu
          Suites: noble-security
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          echo "nameserver 8.8.8.8" | sudo tee chroot/etc/resolv.conf > /dev/null

      - name: Instalar sistema no chroot
        run: |
          set -o pipefail
          sudo cp packages.list chroot/tmp/
          sudo mkdir -p chroot/tmp/mre-config
          sudo cp -r config/* chroot/tmp/mre-config/
          sudo tee chroot/tmp/build-inside.sh > /dev/null <<'EOF'
          #!/bin/bash
          set -e
          export DEBIAN_FRONTEND=noninteractive PATH=/usr/sbin:/usr/bin:/sbin:/bin
          echo "=== [1/7] apt update ==="
          apt update
          echo "=== [2/7] kernel ==="
          apt install -y linux-generic
          echo "=== [3/7] pacotes ==="
          grep -vE '^[[:space:]]*(#|$)' /tmp/packages.list | tr '\n' ' ' > /tmp/pkgs.txt
          wc -w /tmp/pkgs.txt
          apt install -y $(cat /tmp/pkgs.txt)
          echo "=== [4/7] tema MrEzequielOS ==="
          /tmp/mre-config/apply-theme.sh
          echo "=== [4b/7] verificacao tema/boot ==="
          ls /usr/share/gnome-shell/extensions
          which dconf && dconf update && echo DCONF-OK
          dpkg -l | grep -E "plymouth-theme|dconf-cli" || true
          apt purge -y plymouth-theme-ubuntu-logo plymouth-theme-ubuntu-text 2>/dev/null || true
          apt install -y plymouth plymouth-theme-spinner 2>/dev/null || true
          for p in gdm3 gnome-shell plymouth; do dpkg -s $p >/dev/null 2>&1 || apt install -y $p; done
          update-alternatives --set default.plymouth /usr/share/plymouth/themes/spinner/spinner.plymouth || echo "AVISO plymouth"
          update-alternatives --query default.plymouth | grep -E "Value:" || true
          echo "=== [5/7] initramfs ==="
          update-initramfs -u -k all
          lsinitramfs /boot/initrd.img-* 2>/dev/null | grep -i "plymouth.*\(spinner\|ubuntu-logo\)" | head -5 || true
          echo "=== [6/7] branding ==="
          echo "MrEzequielOS" > /etc/hostname
          cp /tmp/mre-config/branding/os-release /etc/os-release
          echo "=== [7/7] limpeza ==="
          apt purge -y snapd* apport whoopsie || true
          if ! dpkg -s gnome-software >/dev/null 2>&1; then apt install -y --no-install-recommends gnome-software; fi
          apt autoremove -y || true
          apt clean
          rm -rf /tmp/* /var/tmp/* /var/log/* /var/cache/debconf/*-old /root/.cache
          rm -f /etc/resolv.conf /etc/machine-id /var/lib/dbus/machine-id
          echo "=== CHROOT OK ==="
          EOF
          sudo chmod +x chroot/tmp/build-inside.sh
          set +e
          sudo chroot chroot /tmp/build-inside.sh 2>&1 | tee /tmp/mre-chroot.log; RC=${PIPESTATUS[0]}
          set -e
          echo "chroot rc=$RC"
          cp /tmp/mre-chroot.log ./mre-chroot.log
          [ $RC -eq 0 ] || exit $RC

      - name: Desmontar chroot
        if: always()
        run: |
          sudo umount -R chroot/dev 2>/dev/null || sudo umount -lf chroot/dev 2>/dev/null || true
          sudo umount -R chroot/sys 2>/dev/null || sudo umount -lf chroot/sys 2>/dev/null || true
          sudo umount chroot/proc 2>/dev/null || sudo umount -lf chroot/proc 2>/dev/null || true
          mount | grep chroot || echo "tudo desmontado"

      - name: Gerar squashfs + ISO
        run: |
          set -e
          mkdir -p iso/casper iso/boot/grub iso/EFI/BOOT iso/.disk iso/install out
          echo "=== manifest ==="
          sudo chroot chroot dpkg-query -W --showformat='${Package} ${Version}\n' | sudo tee iso/casper/filesystem.manifest > /dev/null
          sudo du -sx --block-size=1 chroot | cut -f1 | sudo tee iso/casper/filesystem.size > /dev/null
          KV=$(basename $(ls chroot/boot/vmlinuz-* | head -1) | sed 's/vmlinuz-//')
          echo "Kernel: $KV"
          sudo cp chroot/boot/vmlinuz-$KV iso/casper/vmlinuz
          sudo cp chroot/boot/initrd.img-$KV iso/casper/initrd
          sudo tee iso/boot/grub/grub.cfg > /dev/null <<'EOF'
          insmod part_gpt
          insmod part_msdos
          insmod iso9660
          insmod ext2
          insmod all_video
          insmod gfxterm
          insmod png
          loadfont $prefix/fonts/unicode.pf2
          set gfxmode=auto
          terminal_output gfxterm
          background_image /boot/grub/splash.png
          set menu_color_normal=white/black
          set menu_color_highlight=black/white
          set color_normal=white/black
          set timeout=15
          set default=0
          menuentry "Experimentar o MrEzequielOS" {
              linux /casper/vmlinuz boot=casper quiet splash ---
              initrd /casper/initrd
          }
          menuentry "Instalar o MrEzequielOS" {
              linux /casper/vmlinuz boot=casper only-ubiquity quiet splash ---
              initrd /casper/initrd
          }
          EOF
          sudo tee iso/boot/grub/loopback.cfg > /dev/null <<'EOF'
          menuentry "MrEzequielOS Live" {
              set isofile="/boot/iso/MrEzequielOS-1.1-amd64.iso"
              loopback loop $isofile
              linux (loop)/casper/vmlinuz boot=casper iso-scan/filename=$isofile quiet splash ---
              initrd (loop)/casper/initrd
          }
          EOF
          echo 'MrEzequielOS 1.1 LTS "Noble" - Release amd64' | sudo tee iso/.disk/info > /dev/null
          sudo cp config/branding/grub-bg.png iso/boot/grub/splash.png
          echo "=== squashfs (zstd) ==="
          sudo mksquashfs chroot iso/casper/filesystem.squashfs -comp zstd -b 1M -noappend
          echo "=== ISO (BIOS+UEFI) ==="
          sudo grub-mkrescue --output=out/MrEzequielOS-1.1-amd64.iso iso/ -- -volid "MrEzequielOS 1.1"
          ls -lh out/

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: MrEzequielOS-1.1-amd64
          path: out/*.iso

      - name: Upload log (se falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mre-chroot-log
          path: mre-chroot.log
