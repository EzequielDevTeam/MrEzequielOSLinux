name: release-iso
# Publica a ISO no Release dividida em partes (<2GB cada, limite do GitHub).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag do release (ex: v2.2)'
        required: true
        default: 'v2.2'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Baixar ISO do último build ok
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RID=$(gh run list --workflow=build-iso --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          echo "build=$RID"
          [ -n "$RID" ] && [ "$RID" != "null" ] || { echo "sem build ok"; exit 1; }
          mkdir -p iso
          gh run download "$RID" -D iso/
          find iso -type f | head -20
          ISO=$(find iso -name "*.iso" | head -1)
          [ -n "$ISO" ] || { echo "FALHOU: nenhuma ISO baixada"; exit 1; }
          echo "ISO=$ISO" | tee /tmp/iso.env

      - name: Dividir + checksum + instruções
        run: |
          find iso -type f | head -20
          ISO=$(find iso -name "*.iso" | head -1)
          [ -n "$ISO" ] || { echo "FALHOU: nenhuma ISO baixada"; exit 1; }
          BASE=$(basename "$ISO" .iso)
          mkdir -p out
          split -b 1900M -d "$ISO" "out/${BASE}.part-"
          ls -lh out/
          ( cd out && sha256sum "${BASE}.part-"* > SHA256SUMS.txt && cat SHA256SUMS.txt )
          cat > out/COMO-JUNTAR.txt <<'EOF'
          MrEzequielOS - como juntar as partes e gravar
          =================================================
          Linux/macOS, no terminal na pasta dos arquivos:
            cat MrEzequielOS-*.part-* > MrEzequielOS.iso
            sha256sum -c SHA256SUMS.txt
          Windows (cmd, na pasta):
            copy /b MrEzequielOS-*.part-* MrEzequielOS.iso
          Depois grave com BalenaEtcher, Ventoy ou Rufus (modo DD),
          com Secure Boot desligado.
          EOF

      - name: Enviar ao release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ inputs.tag }}" out/* --clobber
          gh release view "${{ inputs.tag }}" --json assets --jq '.assets[] | "\(.name) \(.size)"'

      - name: Enviar ISO inteira ao Internet Archive
        env:
          IA_ACCESS: ${{ secrets.IA_ACCESS }}
          IA_SECRET: ${{ secrets.IA_SECRET }}
        run: |
          ISO=$(find iso -name "*.iso" | head -1)
          [ -n "$ISO" ] || { echo "FALHOU: nenhuma ISO baixada"; exit 1; }
          BASE=$(basename "$ISO" .iso | tr '[:upper:]' '[:lower:]' | tr '.' '-')
          pip install -q internetarchive
          mkdir -p ~/.config/internetarchive
          printf '[s3]\naccess = %s\nsecret = %s\n' "$IA_ACCESS" "$IA_SECRET" > ~/.config/internetarchive/ia.ini
          chmod 600 ~/.config/internetarchive/ia.ini
          sha256sum "$ISO" | sed "s| .*|  $(basename "$ISO")|" > out/SHA256SUMS-iso.txt
          cat out/SHA256SUMS-iso.txt
          ia upload "$BASE" "$ISO" "out/SHA256SUMS-iso.txt" \
            --metadata="collection:opensource" \
            --metadata="mediatype:software" \
            --metadata="title:MrEzequielOS ${{ inputs.tag }}" \
            --metadata="description:MrEzequielOS Linux - Ubuntu based, Zorin-style desktop. Codigo GPLv3." \
            --metadata="licenseurl:https://www.gnu.org/licenses/gpl-3.0-standalone.html" \
            --retries 10
          echo "https://archive.org/download/$BASE/"
