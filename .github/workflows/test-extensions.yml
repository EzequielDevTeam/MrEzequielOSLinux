name: test-extensions
# Reproduz a sessão GNOME do live (headless) e mostra o estado real das extensões.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'config/gnome/install-extensions.sh'
      - '.github/workflows/test-extensions.yml'

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Instalar GNOME mínimo headless
        run: |
          sudo apt update
          sudo apt install -y gnome-shell dbus-x11 python3 unzip curl

      - name: Instalar extensões (mesmo script da ISO)
        run: |
          chmod +x config/gnome/install-extensions.sh
          sudo bash config/gnome/install-extensions.sh

      - name: Validar metadata (shell 46 em cada zip)
        run: |
          python3 - <<'EOF'
          import zipfile, json, glob, sys
          ok = True
          for d in glob.glob('/usr/share/gnome-shell/extensions/*/'):
              try:
                  m = json.load(open(d + 'metadata.json'))
              except Exception as e:
                  print('SEM metadata:', d, e); ok = False; continue
              svm = m.get('shell-version-map') or {}
              sv = m.get('shell-version') or []
              has46 = ('46' in [str(x) for x in svm.keys()]) or ('46' in [str(x) for x in sv])
              print(('OK  ' if has46 else 'RUIM'), m.get('uuid'), 'v' + str(m.get('version')), '| map:', sorted(svm.keys(), key=str) if svm else sv)
              if not has46 and 'schneegans' not in d and 'jderose' not in d and 'arcmenu' not in d and 'aunetx' not in d and 'rastersoft' not in d and 'rgcjonas' not in d:
                  pass
          sys.exit(0)
          EOF

      - name: Subir GNOME headless e ligar extensões
        run: |
          export XDG_RUNTIME_DIR=/tmp/runtime-mre
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          dbus-run-session -- bash -c '
            export XDG_RUNTIME_DIR=/tmp/runtime-mre
            gnome-shell --headless --wayland > /tmp/shell.log 2>&1 &
            SHELL_PID=$!
            for i in $(seq 1 30); do
              gdbus introspect --session --dest org.gnome.Shell --object-path /org/gnome/Shell >/dev/null 2>&1 && break
              sleep 2
            done
            echo "=== shell no ar, ligando extensoes ==="
            for u in zorin-taskbar@zorinos.com arcmenu@arcmenu.com blur-my-shell@aunetx ding@rastersoft.com appindicatorsupport@rgcjonas.gmail.com; do
              gnome-extensions enable "$u" 2>&1 || true
            done
            sleep 12
            echo "=== LIGADAS ==="
            gnome-extensions list --enabled 2>&1
            echo "=== ESTADO DE CADA UMA ==="
            for u in zorin-taskbar@zorinos.com arcmenu@arcmenu.com blur-my-shell@aunetx ding@rastersoft.com appindicatorsupport@rgcjonas.gmail.com; do
              echo "[$u]"
              gnome-extensions show "$u" 2>&1 | grep -a -E "State|Error" | head -4
            done
            kill $SHELL_PID 2>/dev/null || true
          '
          echo "=== ERROS JS NO LOG ==="
          grep -a -iE "JS ERROR|Extension .* error|error.*extension" /tmp/shell.log | head -20 || echo "(sem erros JS)"

  test-update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Sintaxe de tudo
        run: |
          bash -n config/tools/mrezequielos-update
          bash -n config/tools/mre-apply-lib.sh
          bash -n config/gnome/install-extensions.sh
          bash -n config/apply-theme.sh
          python3 -m py_compile config/tools/mrezequielos-appearance-gtk.py
          echo SINTAXE-OK

      - name: Consistência das listas
        run: |
          python3 - <<'EOF'
          def rd(p):
              return {l.strip() for l in open(p) if l.strip() and not l.strip().startswith('#')}
          req = rd('config/required-extensions.txt')
          obs = rd('config/obsolete-extensions.txt')
          assert req.isdisjoint(obs), 'intersecao required/obsolete: %s' % (req & obs)
          inst = set()
          import re
          txt = open('config/gnome/install-extensions.sh').read()
          m = re.search(r'UUIDS="([^"]+)"', txt)
          inst = set(m.group(1).split())
          missing = {u for u in req if u not in inst and 'zorin-taskbar' not in u}
          # zorin-taskbar vem via git, fora do UUIDS? verifica:
          assert 'zorin-taskbar@zorinos.com' in txt, 'zorin-taskbar sem instalador'
          assert not missing, 'required sem instalador: %s' % missing
          print('listas OK:', len(req), 'required,', len(obs), 'obsoletas')
          EOF

      - name: Core packages existem (dry-run)
        run: |
          sudo apt update
          sudo apt install -y dconf-cli
          grep -vE '^[[:space:]]*(#|$)' config/core-packages.txt | tr '\n' ' ' | xargs sudo apt-get install -s

      - name: Purge só remove obsoletas (fakes)
        run: |
          export MRE_EXT_SYS=/tmp/fake-ext MRE_HOMES=/tmp/fake-home
          mkdir -p "$MRE_EXT_SYS/dash-to-panel@jderose9.github.com" "$MRE_EXT_SYS/zorin-taskbar@zorinos.com"
          touch "$MRE_EXT_SYS/dash-to-panel@jderose9.github.com/metadata.json" "$MRE_EXT_SYS/zorin-taskbar@zorinos.com/metadata.json"
          bash -c 'source config/tools/mre-apply-lib.sh && mre_purge_obsolete config/obsolete-extensions.txt'
          [ ! -e "$MRE_EXT_SYS/dash-to-panel@jderose9.github.com" ] || { echo "FALHOU: obsoleta ficou"; exit 1; }
          [ -f "$MRE_EXT_SYS/zorin-taskbar@zorinos.com/metadata.json" ] || { echo "FALHOU: nova sumiu"; exit 1; }
          echo PURGE-OK

      - name: Reset/backup/restore em db isolado
        run: |
          export DCONF_PROFILE=/tmp/mreprof
          printf 'user-db:testdb\n' > /tmp/mreprof
          export XDG_CONFIG_HOME=/tmp/fakecfg
          mkdir -p /tmp/fakecfg/dconf
          which dconf; dconf --version 2>&1 | head -1
          env | grep -iE "^(DBUS|XDG|DCONF)" || true
          python3 - <<'EOF'
          import subprocess
          # planta valores velhos em algumas chaves da lista
          subprocess.run(['dconf', 'write', '/org/gnome/shell/favorite-apps', "['velho.desktop']"], check=True)
          subprocess.run(['dconf', 'write', '/org/gnome/desktop/interface/gtk-theme', "'Adwaita'"], check=True)
          # backup
          dump = subprocess.run(['dconf', 'dump', '/'], capture_output=True, text=True).stdout
          print('DUMP-LEN:', len(dump))
          print('DUMP-CONTENT:', repr(dump[:300]))
          import os
          print('DBDIR:', os.listdir('/tmp/fakecfg/dconf'))
          assert 'velho.desktop' in dump, 'backup nao capturou'
          open('/tmp/mre-backup-test.txt', 'w').write(dump)
          # reset via lista real
          for line in open('config/dconf-reset-list.txt'):
              p = line.strip()
              if not p or p.startswith('#'):
                  continue
              r = subprocess.run(['dconf', 'reset', '-f', p])
              assert r.returncode == 0, 'reset falhou: ' + p
          dump2 = subprocess.run(['dconf', 'dump', '/'], capture_output=True, text=True).stdout
          assert 'velho.desktop' not in dump2, 'reset nao limpou'
          assert 'Adwaita' not in dump2, 'reset nao limpou tema'
          # restore
          subprocess.run(['dconf', 'load', '/'], input=open('/tmp/mre-backup-test.txt').read(), text=True, check=True)
          dump3 = subprocess.run(['dconf', 'dump', '/'], capture_output=True, text=True).stdout
          assert 'velho.desktop' in dump3, 'restore nao voltou'
          print('RESET-BACKUP-RESTORE-OK')
          EOF

      - name: Temas Zorin instalam de verdade
        run: |
          chmod +x config/gnome/install-zorin-themes.sh
          sudo bash config/gnome/install-zorin-themes.sh
          [ -d /usr/share/themes/ZorinPurple-Dark ] || { echo "FALHOU: tema gtk"; exit 1; }
          [ -d /usr/share/icons/ZorinPurple-Dark ] || { echo "FALHOU: icones"; exit 1; }
          [ -f /usr/share/doc/mrezequielos/LICENSE.zorin-desktop-themes ] || { echo "FALHOU: licenca temas"; exit 1; }
          [ -f /usr/share/doc/mrezequielos/LICENSE.zorin-icon-themes ] || { echo "FALHOU: licenca icones"; exit 1; }
          echo TEMAS-OK

      - name: Interface Zorin aplica (valores no dconf)
        run: |
          sudo mkdir -p /etc/dconf/db/local.d
          sudo cp config/gnome/95-mrezequielos /etc/dconf/db/local.d/95-mrezequielos
          sudo dconf update
          test "$(dconf read /org/gnome/desktop/interface/gtk-theme)" = "'ZorinPurple-Dark'" || { echo "FALHOU gtk-theme: $(dconf read /org/gnome/desktop/interface/gtk-theme)"; exit 1; }
          test "$(dconf read /org/gnome/desktop/interface/icon-theme)" = "'ZorinPurple-Dark'" || { echo "FALHOU icon-theme"; exit 1; }
          test "$(dconf read /org/gnome/desktop/interface/color-scheme)" = "'prefer-dark'" || { echo "FALHOU color-scheme"; exit 1; }
          dconf read /org/gnome/desktop/background/picture-uri-dark | grep -q mrezequielos-wallpaper || { echo "FALHOU wallpaper"; exit 1; }
          dconf read /org/gnome/shell/enabled-extensions | grep -q "zorin-taskbar@zorinos.com" || { echo "FALHOU taskbar nos enabled"; exit 1; }
          dconf read /org/gnome/shell/extensions/zorin-taskbar/panel-positions | grep -q BOTTOM || { echo "FALHOU panel-positions"; exit 1; }
          dconf read /org/gnome/shell/extensions/arcmenu/menu-layout | grep -q arcmenu || { echo "FALHOU arcmenu layout"; exit 1; }
          echo INTERFACE-OK
          sudo rm -f /etc/dconf/db/local.d/95-mrezequielos
          sudo dconf update
