# Config GNOME MrEzequielOS - aplicar no chroot / skel
# Tema escuro + Yaru + Papirus
gsettings set org.gnome.desktop.interface gtk-theme 'Yaru-dark'
gsettings set org.gnome.desktop.interface icon-theme 'Papirus-Dark'
gsettings set org.gnome.desktop.interface font-name 'Ubuntu 11'
gsettings set org.gnome.desktop.wm.preferences theme 'Yaru-dark'
gsettings set org.gnome.desktop.background picture-uri 'file:///usr/share/backgrounds/mrezequielos-wallpaper.jpg'
gsettings set org.gnome.desktop.background picture-uri-dark 'file:///usr/share/backgrounds/mrezequielos-wallpaper.jpg'
gsettings set org.gnome.shell favorite-apps "['brave-browser.desktop', 'org.gnome.Nautilus.desktop', 'org.gnome.Terminal.desktop', 'org.gnome.Software.desktop']"
gsettings set org.gnome.desktop.interface enable-animations true
gsettings set org.gnome.desktop.performance low-power false
